<style>
/* Layout: solo la app, estilo nativo (listas agrupadas, íconos en mosaicos de color, controles segmentados). Escritorio: teléfono centrado; móvil: pantalla completa. */
:root {
  --page: #DDE3E0;
  --bg: #F3F5F4; --surface: #FFFFFF; --ink: #16201C; --muted: #6A7571; --faint: #9AA4A0; --line: #E3E8E5;
  --accent: #1E7864; --accent-soft: #E2F1EC; --ai: #5555D0; --ai-soft: #EEEEFC;
  --danger: #C23B3B; --danger-soft: #FCECEC; --warn-soft: #FFF5E5;
  --t-blue: #3B7DDD; --t-green: #2E9E6B; --t-orange: #E58A2B; --t-purple: #7B5FD3; --t-pink: #D9558A; --t-teal: #1E9AA8; --t-red: #D9534F; --t-gray: #8A9490;
  --e-high: #2E9E6B; --e-mid: #E0A228; --e-low: #8C72C9;
  --bezel: #0E1110; --dim: rgba(16,22,20,.40); --on-accent: #FFFFFF; --switch-off: #D3DAD6; --shadow: 0 1px 2px rgba(16,24,20,.06), 0 4px 14px rgba(16,24,20,.05);
  --f: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0C0F0E;
  --bg: #0F1312; --surface: #1B211F; --ink: #EDF2EF; --muted: #A2ADA8; --faint: #6F7A76; --line: #2A322F;
  --accent: #5CC4A8; --accent-soft: #1C302A; --ai: #A3A6FF; --ai-soft: #23244A;
  --danger: #FF8A8A; --danger-soft: #3A2222; --warn-soft: #33291A;
  --t-blue: #4D8EEB; --t-green: #3BB37D; --t-orange: #F0993C; --t-purple: #9177E6; --t-pink: #E9679B; --t-teal: #2DB0BF; --t-red: #E9625E; --t-gray: #6F7A76;
  --e-high: #4CC48C; --e-mid: #F0B840; --e-low: #A58BE0;
  --bezel: #000000; --dim: rgba(0,0,0,.6); --on-accent: #0D1F19; --switch-off: #3A4440; --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --page: #0C0F0E;
  --bg: #0F1312; --surface: #1B211F; --ink: #EDF2EF; --muted: #A2ADA8; --faint: #6F7A76; --line: #2A322F;
  --accent: #5CC4A8; --accent-soft: #1C302A; --ai: #A3A6FF; --ai-soft: #23244A;
  --danger: #FF8A8A; --danger-soft: #3A2222; --warn-soft: #33291A;
  --t-blue: #4D8EEB; --t-green: #3BB37D; --t-orange: #F0993C; --t-purple: #9177E6; --t-pink: #E9679B; --t-teal: #2DB0BF; --t-red: #E9625E; --t-gray: #6F7A76;
  --e-high: #4CC48C; --e-mid: #F0B840; --e-low: #A58BE0;
  --bezel: #000000; --dim: rgba(0,0,0,.6); --on-accent: #0D1F19; --switch-off: #3A4440; --shadow: none; color-scheme: dark }

* { box-sizing: border-box }
html { height: 100% }
body { min-height: 100%; margin: 0; background: var(--page); color: var(--ink); font-family: var(--f); display: grid; place-items: center; padding-inline: 16px; padding-block: 16px; -webkit-font-smoothing: antialiased }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.lucide { width: 20px; height: 20px; stroke-width: 2; flex: none }

.phone { width: 390px; max-width: 100%; height: min(820px, calc(100vh - 32px)); min-height: 560px; background: var(--bezel); border-radius: 50px; padding: 11px; box-shadow: 0 30px 70px rgba(0,0,0,.30) }
.screen { position: relative; height: 100%; border-radius: 40px; overflow: hidden; background: var(--bg); font-size: 15px; line-height: 1.4; display: flex; flex-direction: column }
.screen.bigtext { font-size: 17px }
@media (max-width: 500px) {
  body { padding: 0; display: block; height: 100% }
  .phone { width: 100%; height: 100%; min-height: 0; border-radius: 0; padding: 0; box-shadow: none; background: var(--bg) }
  .screen { border-radius: 0 } .status { display: none !important }
}
.status { height: 40px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 4px 30px 0; font-size: 14px; font-weight: 700 }
.status .r { display: flex; gap: 5px; align-items: center } .status .lucide { width: 16px; height: 16px }
.app { flex: 1; min-height: 0; display: flex; flex-direction: column }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 24px; scrollbar-width: none }
.scroll::-webkit-scrollbar { display: none }

/* tipografía */
.lt { font-size: 2.05em; font-weight: 800; letter-spacing: -.02em; margin: 0; line-height: 1.1 }
.h2 { font-size: 1.5em; font-weight: 800; letter-spacing: -.015em; margin: 0 0 6px; line-height: 1.15; text-wrap: balance }
.lead { color: var(--muted); margin: 0 0 20px; font-size: 1.02em }
.muted { color: var(--muted) } .small { font-size: .87em }
.label { font-size: .8em; font-weight: 700; color: var(--muted); margin: 22px 4px 8px; display: flex; justify-content: space-between; align-items: baseline }
.label a, .label button { font-weight: 600; color: var(--accent); background: none; border: 0; padding: 0; font-size: 1em }

/* encabezados */
.top { display: flex; align-items: center; gap: 6px; padding: 2px 10px 6px; flex: none; min-height: 50px }
.top .title { flex: 1; min-width: 0; text-align: center; font-weight: 700; font-size: 1.03em }
.top .title small { display: flex; align-items: center; justify-content: center; gap: 5px; font-weight: 500; font-size: .78em; color: var(--muted) }
.big { padding: 4px 12px 8px 20px; display: flex; align-items: center; gap: 6px; flex: none }
.big > div { flex: 1; min-width: 0 }
.ibtn { border: 0; background: transparent; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--ink) }
.ibtn:hover { background: var(--line) }
.ibtn.filled { background: var(--surface); box-shadow: var(--shadow) }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; flex: none; color: #fff; position: relative; font-size: 15px }
.avatar.sm { width: 32px; height: 32px; font-size: 13px }
.avatar .e { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 50%; border: 2.5px solid var(--surface) }

/* superficies */
.group { background: var(--surface); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow) }
.cell { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: transparent; border: 0; text-align: left; position: relative; min-height: 54px }
.cell + .cell::before { content: ""; position: absolute; top: 0; left: 56px; right: 0; height: 1px; background: var(--line) }
.cell .t { flex: 1; min-width: 0 } .cell .t b { font-weight: 600; display: block } .cell .t small { display: block; color: var(--muted); font-size: .85em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.cell .chev { color: var(--faint) }
.cell.danger .t b { color: var(--danger) }
.tile { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none }
.tile .lucide { width: 18px; height: 18px }
.tile.lg { width: 44px; height: 44px; border-radius: 13px } .tile.lg .lucide { width: 22px; height: 22px }
.bl { background: var(--t-blue) } .gr { background: var(--t-green) } .or { background: var(--t-orange) } .pu { background: var(--t-purple) } .pk { background: var(--t-pink) } .te { background: var(--t-teal) } .rd { background: var(--t-red) } .gy { background: var(--t-gray) }
.card { background: var(--surface); border-radius: 20px; padding: 16px; box-shadow: var(--shadow) }
.stack { display: grid; gap: 10px }

/* controles */
.btn { width: 100%; border: 0; border-radius: 999px; height: 52px; font-weight: 700; font-size: 1em; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; gap: 8px }
.btn.tonal { background: var(--accent-soft); color: var(--accent) }
.btn.text { background: transparent; color: var(--accent); height: 44px }
.btn.sm { width: auto; height: 36px; padding: 0 16px; font-size: .9em }
.btn:disabled { opacity: .55; cursor: default }
.sw { flex: none; width: 51px; height: 31px; border-radius: 16px; border: 0; background: var(--switch-off); position: relative; transition: background .2s }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: left .2s }
.sw[aria-checked="true"] { background: var(--accent) } .sw[aria-checked="true"]::after { left: 22px }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: .93em; font-weight: 500; display: inline-flex; align-items: center; gap: 6px }
.chip .lucide { width: 16px; height: 16px }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg) }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--line); border-radius: 12px; padding: 3px; gap: 2px }
.seg button { border: 0; background: transparent; border-radius: 10px; padding: 8px 4px; font-size: .86em; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12) }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.choice { background: var(--surface); border: 2px solid transparent; border-radius: 18px; padding: 14px; text-align: left; display: grid; gap: 10px; box-shadow: var(--shadow); font-weight: 600 }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft) }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--faint); flex: none; display: grid; place-items: center }
.radio.on { border-color: var(--accent); background: var(--accent); color: #fff } .radio .lucide { width: 14px; height: 14px; stroke-width: 3 }
.input { width: 100%; border: 0; border-radius: 12px; padding: 12px 14px; font: inherit; background: var(--line); color: var(--ink) }
.dots { display: inline-flex; gap: 3px; align-items: center } .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line) } .dots i.on { background: var(--ai) }
.edot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none }
.e-high { background: var(--e-high) } .e-mid { background: var(--e-mid) } .e-low { background: var(--e-low) }
.ai-badge { display: inline-flex; align-items: center; gap: 5px; font-size: .78em; font-weight: 700; color: var(--ai); background: var(--ai-soft); border-radius: 999px; padding: 4px 10px }
.ai-badge .lucide { width: 14px; height: 14px }
.note { display: flex; gap: 8px; align-items: center; font-size: .84em; color: var(--muted); padding: 2px 4px }
.note .lucide { width: 16px; height: 16px }

/* onboarding */
.hero { display: grid; place-items: center; padding: 18px 0 8px }
.feature { display: flex; gap: 14px; align-items: center; padding: 10px 0 }
.feature .t b { display: block; font-weight: 700 } .feature .t small { color: var(--muted); font-size: .88em }
.pager { display: flex; gap: 6px; justify-content: center; padding: 6px 0 2px } .pager i { width: 7px; height: 7px; border-radius: 4px; background: var(--line); transition: width .2s } .pager i.on { width: 20px; background: var(--accent) }
.footer { flex: none; padding: 10px 16px 18px; display: grid; gap: 4px; background: var(--bg) }

/* inicio */
.hscroll { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none } .hscroll::-webkit-scrollbar { display: none }
.space { flex: none; width: 150px; background: var(--surface); border: 0; border-radius: 20px; padding: 14px; text-align: left; display: grid; gap: 10px; box-shadow: var(--shadow); position: relative }
.space b { font-weight: 700; font-size: .95em; line-height: 1.25 } .space small { color: var(--muted); font-size: .82em }
.badge { position: absolute; top: 12px; right: 12px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--danger); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 6px }
.datebox { width: 52px; border-radius: 12px; overflow: hidden; text-align: center; flex: none; background: var(--surface); border: 1px solid var(--line) }
.datebox span { display: block; background: var(--t-red); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 0; letter-spacing: .04em }
.datebox b { display: block; font-size: 20px; padding: 3px 0 4px }
.person { display: flex; align-items: center; gap: 12px }
.person .t { flex: 1; min-width: 0 } .person .t b { display: block } .person .t small { color: var(--muted); font-size: .85em }

/* pestañas */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); padding: 8px 4px 18px; box-shadow: 0 -1px 0 var(--line) }
.tabbar button { border: 0; background: transparent; display: grid; justify-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--faint) }
.tabbar .pillwrap { width: 56px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background .2s }
.tabbar button[aria-current="page"] { color: var(--ink) }
.tabbar button[aria-current="page"] .pillwrap { background: var(--accent-soft); color: var(--accent) }

/* chat */
.chat { display: flex; flex-direction: column; gap: 6px; padding: 8px 14px 14px }
.day { align-self: center; font-size: 12px; font-weight: 600; color: var(--faint); padding: 8px 0 4px }
.msg { max-width: 78%; padding: 9px 14px; border-radius: 20px; line-height: 1.35 }
.msg.them { align-self: flex-start; background: var(--surface); border-bottom-left-radius: 6px; box-shadow: var(--shadow) }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 6px }
.msg .who { display: block; font-size: 12px; font-weight: 700; color: var(--t-purple); margin-bottom: 1px }
.sys { align-self: center; font-size: 12px; color: var(--faint); padding: 4px 0; display: flex; gap: 5px; align-items: center } .sys .lucide { width: 14px; height: 14px }
.intro { align-self: stretch; text-align: center; padding: 12px 8px 4px; display: grid; justify-items: center; gap: 6px }
.intro .avatar { width: 64px; height: 64px; font-size: 24px }
.intro .chips { justify-content: center } .intro .chip { padding: 4px 10px; font-size: .8em; border-width: 1px }
.askmean { align-self: flex-start; border: 0; color: var(--ai); background: var(--ai-soft); border-radius: 999px; padding: 5px 11px 5px 9px; font-size: .82em; font-weight: 600; display: inline-flex; gap: 5px; align-items: center; margin: 2px 0 4px }
.askmean .lucide { width: 14px; height: 14px }
.stylechip { align-self: center; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 6px 12px; font-size: .82em; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; color: var(--muted) }
.stylechip .lucide { width: 15px; height: 15px }
.stylebox { align-self: stretch; background: var(--surface); border-radius: 16px; padding: 12px 14px; font-size: .9em; box-shadow: var(--shadow) }
.stylebox ul { margin: 0; padding-left: 18px; display: grid; gap: 3px }
.quick { flex: none; display: flex; gap: 8px; overflow-x: auto; padding: 6px 12px 8px; scrollbar-width: none } .quick::-webkit-scrollbar { display: none }
.quick button { flex: none; border: 0; border-radius: 999px; padding: 8px 13px; font-size: .86em; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; background: var(--surface); box-shadow: var(--shadow) }
.quick button.ai { background: var(--ai-soft); color: var(--ai); box-shadow: none }
.quick .lucide { width: 16px; height: 16px }
.composer { flex: none; display: flex; gap: 8px; align-items: flex-end; padding: 6px 12px 16px; background: var(--bg) }
.field-wrap { flex: 1; background: var(--surface); border-radius: 22px; display: flex; align-items: flex-end; box-shadow: var(--shadow); border: 1.5px solid transparent }
.field-wrap.filled { border-color: var(--ai) }
.field-wrap textarea { flex: 1; resize: none; border: 0; background: transparent; padding: 11px 4px 11px 16px; font: inherit; color: var(--ink); height: 44px; outline: none }
.field-wrap.filled textarea { height: 84px }
.field-wrap .tone { border: 0; background: transparent; color: var(--ai); width: 40px; height: 44px; display: grid; place-items: center }
.send { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none }
.hint { font-size: 12px; color: var(--ai); padding: 0 20px 2px; display: flex; gap: 5px; align-items: center } .hint .lucide { width: 13px; height: 13px }
.banner { align-self: stretch; background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); display: grid; gap: 10px; margin-top: 4px }

/* hoja inferior */
.dim { position: absolute; inset: 0; background: var(--dim); display: flex; align-items: flex-end; z-index: 5; animation: fade .2s }
.sheet { width: 100%; max-height: 86%; overflow-y: auto; background: var(--bg); border-radius: 28px 28px 0 0; padding: 8px 16px 22px; animation: up .25s ease-out; scrollbar-width: none }
@keyframes up { from { transform: translateY(40px); opacity: .6 } } @keyframes fade { from { opacity: 0 } }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--faint); opacity: .5; margin: 0 auto 12px }
.sheet-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px }
.sheet-h b { flex: 1; font-size: 1.15em; font-weight: 800 }
.sug { background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); display: grid; gap: 8px }
.sug .k { font-size: .76em; font-weight: 700; color: var(--ai); letter-spacing: .02em; text-transform: uppercase }
.sug .idea { font-size: 1.02em; font-weight: 500; line-height: 1.35 }
.sug .foot { display: flex; align-items: center; gap: 10px }
.sug .foot .grow { flex: 1; display: flex; gap: 10px; align-items: center; font-size: .8em; color: var(--muted) }
.sug .why { font-size: .86em; color: var(--muted); background: var(--bg); border-radius: 10px; padding: 8px 10px }
.linkish { border: 0; background: none; padding: 0; color: var(--muted); font-size: 1em; font-weight: 600; display: inline-flex; gap: 4px; align-items: center } .linkish .lucide { width: 14px; height: 14px }
.direct { background: var(--accent-soft); border-radius: 18px; padding: 14px; display: grid; gap: 8px }
.direct b { color: var(--accent) }

/* evento */
.ev-hero { display: flex; gap: 14px; align-items: center; padding: 6px 4px 16px }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.fact { background: var(--surface); border-radius: 18px; padding: 14px; display: grid; gap: 8px; box-shadow: var(--shadow) }
.fact b { font-weight: 700; font-size: .95em } .fact small { color: var(--muted); font-size: .8em; display: block }
.tl { list-style: none; margin: 0; padding: 4px 14px; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow) }
.tl li { display: grid; grid-template-columns: 46px 14px 1fr; gap: 10px; align-items: start; padding: 10px 0; font-size: .93em }
.tl .h { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted) }
.tl .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 5px }

.toast { position: absolute; left: 16px; right: 16px; bottom: 90px; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 13px 16px; font-size: .92em; font-weight: 500; z-index: 9; display: flex; gap: 10px; align-items: center; animation: up .2s ease-out }
.toast .lucide { width: 18px; height: 18px }
.mood { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px }
.mood button { border: 0; border-radius: 14px; height: 44px; font-weight: 700; background: var(--bg) }
.mood button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent) }

.screen.lowstim { filter: saturate(.25) }
.screen.lowstim *, .screen.lowstim { animation: none !important; transition: none !important }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>

<script>
const ic = (n) => `<i data-lucide="${n}"></i>`;

/* ---------- contenido (Ficha 1) ---------- */
const OCC = [['uni', 'Universidad', 'graduation-cap', 'bl'], ['inst', 'Instituto', 'book-open', 'te'], ['job', 'Primer empleo', 'briefcase', 'or'], ['other', 'Otra', 'ellipsis', 'gy']];

    : `<button class="stylechip" data-act="style">${ic('id-card')}Estilo de ${c.name}</button>`);
  const one = (m) => {
    if (m.day) return `<span class="day">${m.day}</span>`;
    if (m.sys) return `<span class="sys">${ic('clock')}${m.sys}</span>`;
    if (m.me) return `<div class="msg me">${esc(m.me)}</div>`;
    let h = `<div class="msg them">${m.who ? `<span class="who">${m.who}</span>` : ''}${esc(m.them)}</div>`;
    if (m.amb && S.aiOn && S.support !== 'min' && !S.sent[id].length) h += `<button class="askmean" data-act="sheet:${m.amb}">${ic('sparkles')}${c.group ? '¿Qué se decidió?' : '¿Qué quiso decir?'}</button>`;
    return h;
  };
  c.msgs.forEach(m => { if (!(m.sys && S.sent[id].length)) out.push(one(m)); });
  S.sent[id].forEach(m => out.push(one({ me: m })));
  if (S.replied[id]) {
    c.reply.forEach(m => out.push(one(m)));
    if (c.nextStep) out.push(`<div class="banner"><span class="ai-badge">${ic('sparkles')}Sugerencia</span><b>¿Conocerse en persona?</b><span class="small muted">Diego te invitó al club del jueves.</span><button class="btn sm tonal" style="justify-self:start" data-act="nav:next">Ver opciones</button></div>`);

}

/* ---------- render y acciones ---------- */
function render() {
  $('#app').innerHTML = VIEWS[S.route]() + (S.toast ? `<div class="toast" role="status">${ic(S.toast[1])}<span>${esc(S.toast[0])}</span></div>` : '');
  const sc = $('#screen'); sc.classList.toggle('lowstim', S.lowstim); sc.classList.toggle('bigtext', S.bigtext);
  if (window.lucide) lucide.createIcons();
  const cs = $('#chatScroll'); if (cs) cs.scrollTop = cs.scrollHeight;
}
let toastT;
function toast(m, icon = 'check') { S.toast = [m, icon]; render(); clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; render(); }, 3000); }
function nav(r) { S.stack.push(S.route); S.route = r; S.sheet = null; render(); }
function back() { S.sheet = null; S.route = S.stack.pop() || 'home'; render(); }

function act(a) {
  const i = a.indexOf(':'); const k = i < 0 ? a : a.slice(0, i), v = i < 0 ? '' : a.slice(i + 1);
  const c = S.chat && CHATS[S.chat];
  switch (k) {
    case 'ob': return nav('ob' + v);
    case 'nav': return nav(v);
    case 'back': return back();
    case 'tab': S.stack = []; S.route = v; S.sheet = null; return render();
    case 'start': S.stack = []; S.route = 'home'; return render();
    case 'tog': S[v] = !S[v]; return render();
    case 'occ': S.occ = v; return render();
    case 'support': S.support = v; if (v === 'max') S.bigtext = true; return render();
    case 'trust': S.trust = !S.trust; return render();
    case 'hard': S.hard.has(v) ? S.hard.delete(v) : S.hard.add(v); return render();
    case 'int': S.interests.has(v) ? S.interests.delete(v) : S.interests.add(v); return render();
    case 'energy': S.energy = v; if (S.route === 'help') return toast('Pausa activada. Verán que necesitas tiempo.', 'pause'); return render();
    case 'filter': S.filters.has(v) ? S.filters.delete(v) : S.filters.add(v); return render();
    case 'join': S.joined.add(v); return toast('Te uniste. Puedes solo leer.', 'eye');
    case 'going': S.going = !S.going; return S.going ? toast('Le avisamos a Lucía.', 'check') : render();
    case 'open': S.chat = v; S.showStyle = false; return nav('chat');
    case 'style': S.showStyle = !S.showStyle; return render();
    case 'sheet': if (!S.aiOn) return; S.sheet = 'ai'; S.tab = v; return render();
    case 'why': S.why[S.tab + v] = !S.why[S.tab + v]; return render();
    case 'tone': { const t = ($('#draft')?.value || '').trim(); if (!t) return toast('Escribe algo y te digo cómo puede sonar.', 'wand-sparkles'); S.draft[S.chat] = t; S.sheet = 'tone'; return render(); }
    case 'close': S.sheet = null; return render();
    case 'use': S.draft[S.chat] = c.tabs[S.tab].sugs[+v].idea; S.sheet = null; return render();
    case 'usedirect': S.draft[S.chat] = c.tabs[S.tab].direct; S.sheet = null; return render();
    case 'send': {
      const t = ($('#draft')?.value || '').trim();
      if (!t) return toast('Escribe algo primero. Sin apuro.', 'clock');
      const id = S.chat; S.sent[id].push(t); S.draft[id] = ''; render();
      setTimeout(() => { S.replied[id] = true; if (S.route === 'chat' && S.chat === id) render(); }, 1100);
      return;
    }
    case 'step': S.step = +v; return render();
    case 'sendstep': { const t = ($('#stepmsg')?.value || '').trim(); if (t) S.sent.diego.push(t); if (S.step === 0) S.going = true; S.route = S.stack.pop() || 'chat'; S.chat = 'diego'; return toast('Enviado con tus palabras.', 'send'); }
    case 'pcat': S.pcat = v; return render();
    case 'copy': {
      const ok = () => toast('Frase copiada', 'copy'), ko = () => toast('Mantén presionada la frase para copiarla', 'copy');
      try { navigator.clipboard.writeText(v).then(ok, ko); } catch (e) { ko(); }
      return;
    }
    case 'addphrase': { const t = ($('#newphrase')?.value || '').trim(); if (!t) return toast('Escribe la frase primero', 'pen-line'); S.myPhrases.push(t); return toast('Frase guardada', 'bookmark'); }
    case 'human': S.helped = true; return toast('Una mentora te escribirá (lun–vie, 9–18 h).', 'user-round');
    case 'alert': S.showAlert = !S.showAlert; return render();
    case 'mood': S.mood = +v; return render();
    case 'reset': S = initial(); return render();
    case 'toast': return toast(v, 'info');
  }
}

$('#app').addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  if (t.classList.contains('dim') && e.target !== t) return;
  act(t.dataset.act);
});
$('#app').addEventListener('input', (e) => { if (e.target.id === 'draft') S.draft[S.chat] = e.target.value; });
render();
</script>
